name: Build Coolify image

on:
  push:
    branches:
      - deploy/coolify
  workflow_dispatch:

concurrency:
  group: coolify-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish web image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Coolify image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          push: true
          tags: |
            ghcr.io/xerrion/omniroute:coolify
            ghcr.io/xerrion/omniroute:coolify-${{ github.sha }}
          cache-from: type=gha,scope=coolify-web-amd64
          cache-to: type=gha,scope=coolify-web-amd64,mode=max,ignore-error=true
